name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facts:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Show more of what the base image ships
        run: |
          url=$(curl -fsSIL --retry 3 -o /dev/null -w '%{url_effective}' https://downloads.raspberrypi.com/raspios_lite_armhf_latest)
          curl -fsSL --retry 3 -o base.img.xz "$url"
          xz -d base.img.xz
          loop=$(sudo losetup --find --show --partscan --read-only base.img)
          sudo udevadm settle || true
          for _ in 1 2 3 4 5; do [ -b "${loop}p2" ] && break; sleep 1; done
          sudo mkdir -p /mnt/base
          sudo mount -o ro,noload "${loop}p2" /mnt/base
          sudo mount -o ro "${loop}p1" /mnt/base/boot/firmware
          cd /mnt/base
          show() {
            local f
            for f in "$@"; do
              echo "=================== $f"
              if sudo test -d "$f"; then sudo ls -la "$f"; else sudo cat "$f" 2>&1 || true; fi
            done
          }
          show usr/lib/python3/dist-packages/cloudinit/distros/raspberry_pi_os.py \
            usr/lib/python3/dist-packages/cloudinit/config/cc_raspberry_pi.py
          echo "=================== create_user"
          sudo grep -n "def create_user" -A 125 usr/lib/python3/dist-packages/cloudinit/distros/__init__.py || true
          echo "=================== enable_ssh mentions"
          sudo grep -rn "enable_ssh\|rename-user\|cancel-rename\|userconf" usr/lib/python3/dist-packages/cloudinit --include='*.py' | cut -c1-220 || true
          echo "=================== rpi-cloud-init-mods files"
          sudo cat var/lib/dpkg/info/rpi-cloud-init-mods.list || true
          for f in $(sudo cat var/lib/dpkg/info/rpi-cloud-init-mods.list); do
            f=${f#/}
            if sudo test -f "$f" && [ "$(sudo stat -c %s "$f")" -lt 30000 ]; then
              case $f in usr/share/doc/*|*.pyc) continue ;; esac
              echo "=================== $f"; sudo cat "$f"
            fi
          done
          show usr/lib/raspberrypi-sys-mods/imager_custom usr/lib/raspberrypi-sys-mods/sshswitch \
            usr/lib/raspberrypi-sys-mods/get_fw_loc usr/share/userconf-pi/sshd_banner \
            etc/update-motd.d/10-uname etc/update-motd.d/99-rpi-usb-gadget boot/firmware/config.txt etc/fstab \
            usr/lib/systemd/system-preset usr/lib/systemd/system-preset/* etc/NetworkManager/NetworkManager.conf \
            etc/systemd/system/cloud-config.target.wants etc/systemd/system/graphical.target.wants \
            etc/systemd/system/network-online.target.wants etc/systemd/system/bluetooth.target.wants \
            etc/systemd/system/ssh.service.wants etc/default/useradd etc/adduser.conf etc/rpi-issue \
            var/lib/dpkg/info/userconf-pi.postinst usr/lib/systemd/system/first-boot-complete.target \
            usr/lib/systemd/system/systemd-growfs-root.service usr/lib/systemd/system/rpi-eeprom-update.service
          echo "=================== raspi-config boot functions"
          sudo grep -n "^get_boot_cli\|^get_autologin\|^do_boot_behaviour\|^get_boot_wait\|^is_pi \|^is_pi()" -A 45 usr/bin/raspi-config | cut -c1-200 || true
          echo "=================== getty"
          sudo grep -n "Install" -A 4 usr/lib/systemd/system/getty@.service || true
          sudo ls -la etc/systemd/system/getty@tty1.service.d 2>&1 || true
          echo "=================== fstab and partitions"
          sudo sfdisk -l "$OLDPWD/base.img" || true

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12 (Python 3.11, Pillow 9.4)
            python: '3.11'
            packages: pillow==9.4.0 numpy==1.24.2
          - name: Debian 13 (Python 3.13)
            python: '3.13'
            packages: pillow numpy
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install ${{ matrix.packages }} pyserial pytest pyflakes
      - name: Lint
        run: python -m pyflakes quartermaster tests tools
      - name: Load the CardputerZero AppStore install policy
        run: |
          mkdir -p tests/vendor
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/CardputerZero/packages/5d55615e69cda109bdf20ea4a8e69c528bc19374/.github/scripts/install_path_policy.py' -o tests/vendor/install_path_policy.py
          python -c 'from tests.vendor.install_path_policy import rejected_paths'
      - name: Build the Cardputer package to check
        run: |
          package=$(python tools/build_deb.py --out build)
          echo "QUARTERMASTER_STORE_DEB=$package" >> "$GITHUB_ENV"
      - name: Tests
        run: python -m pytest -q tests
      - name: Render every screen
        run: python tools/render_screens.py --out build/screenshots
      - name: Build the Raspberry Pi package
        run: python tools/build_deb.py --target pi --out build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.python == '3.13'
        with:
          name: quartermaster
          path: |
            build/quartermaster_*.deb
            build/screenshots/*.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.python == '3.13'
        with:
          name: quartermaster-pi
          path: build/quartermaster-pi_*.deb
          if-no-files-found: error
