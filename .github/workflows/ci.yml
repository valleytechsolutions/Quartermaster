name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        setup: [default, imager]
    name: First start (${{ matrix.setup }})
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install the emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-utils sshpass xz-utils
      - name: Fetch a practice image
        run: gh run download 45787783091 --name image-st7735-128 --dir build/boot
      - name: Start the image and check its first start
        run: tools/boot_image.sh --image build/boot/*.img.xz --work build/boot/work ${{ matrix.setup == 'imager' && '--imager' || '' }}
      - name: Keep the console output
        if: always()
        run: |
          for file in build/boot/work/console-*.log; do
            echo "=================== $file"; tail -n 250 "$file" || true
          done
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12 (Python 3.11, Pillow 9.4)
            python: '3.11'
            packages: pillow==9.4.0 numpy==1.24.2
          - name: Debian 13 (Python 3.13)
            python: '3.13'
            packages: pillow numpy
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install ${{ matrix.packages }} pyserial pyyaml pytest pyflakes
      - name: Lint
        run: python -m pyflakes quartermaster tests tools
      - name: Load the CardputerZero AppStore install policy
        run: |
          mkdir -p tests/vendor
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/CardputerZero/packages/5d55615e69cda109bdf20ea4a8e69c528bc19374/.github/scripts/install_path_policy.py' -o tests/vendor/install_path_policy.py
          python -c 'from tests.vendor.install_path_policy import rejected_paths'
      - name: Build the Cardputer package to check
        run: |
          package=$(python tools/build_deb.py --out build)
          echo "QUARTERMASTER_STORE_DEB=$package" >> "$GITHUB_ENV"
      - name: Tests
        run: python -m pytest -q tests
      - name: Render every screen
        run: python tools/render_screens.py --out build/screenshots
      - name: Build the Raspberry Pi package
        run: python tools/build_deb.py --target pi --out build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.python == '3.13'
        with:
          name: quartermaster
          path: |
            build/quartermaster_*.deb
            build/screenshots/*.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.python == '3.13'
        with:
          name: quartermaster-pi
          path: build/quartermaster-pi_*.deb
          if-no-files-found: error
