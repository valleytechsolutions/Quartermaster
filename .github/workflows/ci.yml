name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facts:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Show more of what the base image ships
        run: |
          url=$(curl -fsSIL --retry 3 -o /dev/null -w '%{url_effective}' https://downloads.raspberrypi.com/raspios_lite_armhf_latest)
          curl -fsSL --retry 3 -o base.img.xz "$url"
          xz -d base.img.xz
          loop=$(sudo losetup --find --show --partscan --read-only base.img)
          sudo udevadm settle || true
          for _ in 1 2 3 4 5; do [ -b "${loop}p2" ] && break; sleep 1; done
          sudo mkdir -p /mnt/base
          sudo mount -o ro,noload "${loop}p2" /mnt/base
          sudo mount -o ro "${loop}p1" /mnt/base/boot/firmware
          cd /mnt/base
          show() {
            local f
            for f in "$@"; do
              echo "=================== $f"
              if sudo test -d "$f"; then sudo ls -la "$f"; else sudo cat "$f" 2>&1 || true; fi
            done
          }
          show var/lib/NetworkManager var/lib/NetworkManager/NetworkManager.state etc/NetworkManager \
            etc/NetworkManager/NetworkManager.conf usr/lib/NetworkManager/conf.d usr/lib/NetworkManager/conf.d/* \
            etc/modprobe.d etc/modprobe.d/* usr/lib/modprobe.d etc/profile.d etc/profile.d/wifi-check.sh \
            etc/profile.d/sshpwd.sh etc/modules-load.d usr/lib/modules
          echo "=================== rfkill mentions"
          sudo grep -rn -i "rfkill" etc/modprobe.d usr/lib/modprobe.d etc/modules-load.d usr/lib/modules-load.d \
            etc/udev/rules.d usr/lib/udev/rules.d etc/profile.d usr/lib/raspberrypi-sys-mods boot/firmware/cmdline.txt \
            boot/firmware/config.txt etc/NetworkManager usr/lib/NetworkManager usr/lib/systemd/system \
            etc/systemd/system 2>/dev/null | cut -c1-220 || true
          echo "=================== rfkill built in"
          sudo grep -h "rfkill\|cfg80211\|brcmfmac" usr/lib/modules/*/modules.builtin | sort | uniq -c || true
          sudo find usr/lib/modules -name 'rfkill*.ko*' | head -5 || true
          echo "=================== saved rfkill states"
          for f in var/lib/systemd/rfkill/*; do echo "$f: $(sudo cat "$f")"; done
          echo "=================== raspi-config wifi country"
          sudo grep -n "^do_wifi_country\|^get_wifi_country\|^do_wifi_ssid_passphrase\|^do_net_names" -A 60 usr/bin/raspi-config | cut -c1-200 | head -260 || true
          echo "=================== imager_custom"
          sudo cat usr/lib/raspberrypi-sys-mods/imager_custom || true
          echo "=================== regulatory"
          sudo ls -la usr/lib/firmware/regulatory.db* usr/lib/crda 2>&1 | head || true
          sudo grep -rn "ccode\|regrev" usr/lib/firmware/brcm/brcmfmac43430-sdio.txt usr/lib/firmware/brcm/brcmfmac43436-sdio.txt \
            usr/lib/firmware/brcm/brcmfmac43455-sdio.txt usr/lib/firmware/cypress/*.txt 2>/dev/null | head -20 || true
          sudo ls -la usr/lib/firmware/brcm | head -60 || true

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12 (Python 3.11, Pillow 9.4)
            python: '3.11'
            packages: pillow==9.4.0 numpy==1.24.2
          - name: Debian 13 (Python 3.13)
            python: '3.13'
            packages: pillow numpy
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install ${{ matrix.packages }} pyserial pytest pyflakes
      - name: Lint
        run: python -m pyflakes quartermaster tests tools
      - name: Load the CardputerZero AppStore install policy
        run: |
          mkdir -p tests/vendor
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/CardputerZero/packages/5d55615e69cda109bdf20ea4a8e69c528bc19374/.github/scripts/install_path_policy.py' -o tests/vendor/install_path_policy.py
          python -c 'from tests.vendor.install_path_policy import rejected_paths'
      - name: Build the Cardputer package to check
        run: |
          package=$(python tools/build_deb.py --out build)
          echo "QUARTERMASTER_STORE_DEB=$package" >> "$GITHUB_ENV"
      - name: Tests
        run: python -m pytest -q tests
      - name: Render every screen
        run: python tools/render_screens.py --out build/screenshots
      - name: Build the Raspberry Pi package
        run: python tools/build_deb.py --target pi --out build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.python == '3.13'
        with:
          name: quartermaster
          path: |
            build/quartermaster_*.deb
            build/screenshots/*.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.python == '3.13'
        with:
          name: quartermaster-pi
          path: build/quartermaster-pi_*.deb
          if-no-files-found: error
