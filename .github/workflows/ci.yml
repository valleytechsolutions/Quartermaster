name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12 (Python 3.11, Pillow 9.4)
            python: '3.11'
            packages: pillow==9.4.0 numpy==1.24.2
          - name: Debian 13 (Python 3.13)
            python: '3.13'
            packages: pillow numpy
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install ${{ matrix.packages }} pyserial pytest pyflakes
      - name: Lint
        run: python -m pyflakes quartermaster tests tools
      - name: Tests
        run: python -m pytest -q tests
      - name: Render every screen
        run: python tools/render_screens.py --out build/screenshots
      - name: Build the package
        run: python tools/build_deb.py --out build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.python == '3.13'
        with:
          name: quartermaster
          path: |
            build/*.deb
            build/screenshots/*.png
