name: Raspberry Pi images

on:
  push:
    tags: ['pi-v*']
  schedule:
    - cron: '23 5 2 * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Pi release to rebuild the images for, like pi-v1.2.8 (empty for the newest)
        required: false
        default: ''
      practice:
        description: Practice run. Build both images from this branch and publish nothing
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: pi-images
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
      PUSHED: ${{ github.ref_name }}
      REQUESTED: ${{ inputs.tag }}
      PRACTICE: ${{ inputs.practice }}
    steps:
      - name: Pick the Pi release
        id: pick
        run: |
          if [ "$PRACTICE" = true ]; then
            echo "Practice run: the images are built from this branch and nothing is published."
            exit 0
          fi
          if [ "$EVENT" = push ]; then
            tag=$PUSHED
          elif [ -n "$REQUESTED" ]; then
            tag=$REQUESTED
          else
            tag=$(gh release list --limit 100 --json tagName,isDraft,createdAt \
              --jq '[.[] | select((.tagName | startswith("pi-v")) and (.isDraft | not))] | sort_by(.createdAt) | last | .tagName // empty')
          fi
          [[ $tag =~ ^pi-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No Pi release to build images for ($tag)"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  facts:
    if: inputs.practice
    runs-on: ubuntu-24.04
    steps:
      - name: Show what the base image ships
        run: |
          url=$(curl -fsSIL --retry 3 -o /dev/null -w '%{url_effective}' https://downloads.raspberrypi.com/raspios_lite_armhf_latest)
          echo "$url"
          curl -fsSL --retry 3 -o base.img.xz "$url"
          xz -d base.img.xz
          loop=$(sudo losetup --find --show --partscan --read-only base.img)
          sudo udevadm settle || true
          for _ in 1 2 3 4 5; do [ -b "${loop}p2" ] && break; sleep 1; done
          sudo mkdir -p /mnt/base
          sudo mount -o ro,noload "${loop}p2" /mnt/base
          sudo mount -o ro "${loop}p1" /mnt/base/boot/firmware
          cd /mnt/base
          show() {
            local f
            for f in "$@"; do
              echo "=================== $f"
              if sudo test -d "$f"; then sudo ls -la "$f"; else sudo cat "$f" 2>&1 || true; fi
            done
          }
          show boot/firmware boot/firmware/user-data boot/firmware/meta-data boot/firmware/network-config \
            boot/firmware/cmdline.txt boot/firmware/issue.txt
          show etc/cloud etc/cloud/cloud.cfg etc/cloud/cloud.cfg.d etc/cloud/cloud.cfg.d/* etc/cloud/ds-identify.cfg
          show usr/lib/systemd/system/userconfig.service etc/systemd/system/userconfig.service \
            usr/bin/rename-user usr/bin/cancel-rename usr/lib/userconf-pi usr/lib/userconf-pi/*
          show usr/lib/systemd/system/cloud-init-local.service usr/lib/systemd/system/cloud-init-network.service \
            usr/lib/systemd/system/cloud-init-main.service usr/lib/systemd/system/cloud-init.service \
            usr/lib/systemd/system/cloud-config.service usr/lib/systemd/system/cloud-final.service \
            usr/lib/systemd/system/cloud-init.target usr/lib/systemd/system/regenerate_ssh_host_keys.service \
            usr/lib/systemd/system/rpi-resize.service usr/lib/systemd/system/ssh.service \
            usr/lib/systemd/system/sshswitch.service usr/lib/systemd/system/systemd-user-sessions.service
          show etc/ssh/sshd_config.d etc/ssh/sshd_config.d/* etc/pam.d/sshd etc/pam.d/login etc/update-motd.d etc/motd
          echo "=================== sshd_config"; sudo grep -v '^[[:space:]]*\(#\|$\)' etc/ssh/sshd_config || true
          echo "=================== accounts"
          sudo awk -F: '$3 == 0 || $3 >= 1000 {print}' etc/passwd
          sudo awk -F: '$1 == "pi" || $1 == "root" {print $1 ": " substr($2, 1, 3) " (" length($2) " characters)"}' etc/shadow
          sudo grep -E '(^|[:,])pi(,|$)' etc/group | cut -d: -f1 | xargs
          sudo grep -E '^[[:space:]]*(UID_MAX|GID_MAX|UID_MIN)' etc/login.defs || true
          show etc/sudoers.d etc/sudoers.d/* etc/hostname etc/hosts etc/machine-id var/lib/systemd/rfkill
          show etc/systemd/system etc/systemd/system/multi-user.target.wants etc/systemd/system/sysinit.target.wants \
            etc/systemd/system/getty.target.wants etc/systemd/system/cloud-init.target.wants \
            etc/systemd/system/sockets.target.wants etc/systemd/system/timers.target.wants \
            etc/systemd/system/default.target etc/NetworkManager/conf.d etc/netplan usr/lib/raspberrypi-sys-mods
          echo "=================== default target"; sudo readlink etc/systemd/system/default.target usr/lib/systemd/system/default.target || true
          echo "=================== packages"
          sudo awk '/^Package:/ {p = $2} /^Version:/ {print p, $2}' var/lib/dpkg/status |
            grep -E '^(cloud-init|userconf-pi|raspi-config|raspberrypi-sys-mods|systemd|openssh-server|network-manager|netplan\.io|avahi-daemon|python3-yaml|python3|rpi-[a-z-]+|raspi-firmware|linux-image-[a-z0-9+.-]+|libpam-modules|polkitd|bluez|gpsd|python3-pil|python3-numpy|python3-spidev|python3-rpi-lgpio|python3-lgpio|python3-gpiozero) ' || true
          echo "=================== free space"; df -h /mnt/base /mnt/base/boot/firmware

  image:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        hat: [st7735-128, st7789-240]
    name: Image for ${{ matrix.hat }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release.outputs.tag }}
      HAT: ${{ matrix.hat }}
      PRACTICE: ${{ inputs.practice }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install the image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support xz-utils e2fsprogs fdisk
          test -e /proc/sys/fs/binfmt_misc/qemu-arm
      - name: Build the Pi package from this branch
        if: inputs.practice
        run: |
          python3 tools/build_deb.py --target pi --out build/pi
          version=$(python3 -c "import json; print(json.load(open('app-builder.json'))['version'])")
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Wait for the Pi package
        if: ${{ !inputs.practice }}
        run: |
          mkdir -p build/pi
          version=${TAG#pi-v}
          for attempt in $(seq 1 40); do
            if gh release download "$TAG" --dir build/pi --clobber \
                --pattern "quartermaster-pi_${version}_all.deb" --pattern SHA256SUMS; then
              break
            fi
            [ "$attempt" -lt 40 ] || { echo "::error::$TAG has no Pi package"; exit 1; }
            sleep 30
          done
          cd build/pi
          sha256sum --check --ignore-missing --strict SHA256SUMS
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Name the package and the image
        run: |
          test -f "build/pi/quartermaster-pi_${VERSION}_all.deb"
          echo "DEB=build/pi/quartermaster-pi_${VERSION}_all.deb" >> "$GITHUB_ENV"
          echo "IMAGE=quartermaster-pi-${VERSION}-${HAT}.img.xz" >> "$GITHUB_ENV"
      - name: Build the image
        run: |
          sudo tools/build_image.sh --hat "$HAT" --deb "$DEB" --out build/images
          sudo chown -R "$(id -u):$(id -g)" build/images
      - name: Check the image
        run: |
          cd build/images
          size=$(stat -c %s "$IMAGE")
          [ "$size" -lt 2147483648 ] || { echo "::error::$IMAGE is $size bytes, over the 2 GiB asset limit"; exit 1; }
          xz --test "$IMAGE"
          sha256sum --check --strict SHA256SUMS
          grep -F "  $IMAGE" SHA256SUMS > "$IMAGE.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.hat }}
          path: |
            build/images/*.img.xz
            build/images/*.img.xz.sha256
            build/images/*.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [release, image]
    if: ${{ !inputs.practice }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Collect the images
        run: |
          gh run download "$GITHUB_RUN_ID" --pattern 'image-*' --dir build/download
          mkdir build/release
          mv build/download/*/* build/release/
          cd build/release
          images=(*.img.xz)
          [ "${#images[@]}" = 2 ] || { echo "::error::Expected two images, got ${images[*]}"; exit 1; }
          for sum in *.img.xz.sha256; do
            sha256sum --check --strict "$sum"
          done
      - name: Write the Raspberry Pi Imager list
        run: |
          python3 tools/imager_os_list.py --repo "$GITHUB_REPOSITORY" --tag "$TAG" build/release/*.json \
            > build/release/quartermaster-imager.json
      - name: Publish the images and the Imager list together
        run: |
          cd build/release
          ../../tools/replace_release_assets.sh "$TAG" *.img.xz *.img.xz.sha256 quartermaster-imager.json
