name: Raspberry Pi prerelease

# Pushing a tag pi-v<version>, or running this workflow by hand, tests the app, builds the Pi package and
# publishes it as a prerelease. A run by hand also starts the image build, because a tag made here starts no workflow.
on:
  push:
    tags: ['pi-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Pi release tag, for example pi-v1.2.8. It is created from this branch if it does not exist.'
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Check the Pi release tag
        run: |
          version=$(python -c "import json; print(json.load(open('app-builder.json'))['version'])")
          test "$TAG" = "pi-v$version" || { echo "::error::Expected pi-v$version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Test the app and build the Pi package
        run: |
          python -m pip install pillow numpy pyserial pyyaml pytest
          python -m pytest -q tests
          python tools/build_deb.py --target pi --out build/pi
          cd build/pi
          sha256sum "quartermaster-pi_${VERSION}_all.deb" > SHA256SUMS
      - name: Publish the Pi prerelease
        run: |
          package="quartermaster-pi_${VERSION}_all.deb"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if git fetch --no-tags origin "refs/tags/$TAG" 2>/dev/null; then
              test "$(git rev-parse HEAD)" = "$(git rev-parse 'FETCH_HEAD^{commit}')" || {
                echo "::error::$TAG already exists on another commit. A change needs a new version. To build the images of $TAG again, run the Raspberry Pi images workflow with this tag."
                exit 1; }
            fi
            tag_option=(--target "$(git rev-parse HEAD)")
          else
            tag_option=(--verify-tag)
          fi
          if release=$(gh release view "$TAG" --json assets,isDraft,isPrerelease); then
            jq -e --arg package "$package" \
              '.isPrerelease and (.isDraft | not) and ([.assets[].name] | index($package) != null and index("SHA256SUMS") != null)' \
              <<< "$release" || { echo "::error::Check the existing Pi release and its assets"; exit 1; }
            echo "$TAG already has its Pi package and checksums."
            exit 0
          fi
          gh release create "$TAG" "${tag_option[@]}" --prerelease --latest=false \
            --title "Quartermaster $VERSION for Raspberry Pi" \
            --notes "Raspberry Pi build for the Waveshare 1.44-inch and 1.3-inch LCD HATs.

          **To flash a ready SD card:** install Raspberry Pi Imager 2, download \`quartermaster.rpi-imager-manifest\` below and open it. Imager then lists the image for each HAT. The [build and installation guide](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/diy.md) has every step.

          The images log in as user \`pi\` with password \`pi\` and have SSH on. Change the password with \`passwd\` after your first login. They are added to this release shortly after it is published and rebuilt every month with the latest Raspberry Pi OS updates." \
            "build/pi/$package" build/pi/SHA256SUMS
      - name: Start the image build
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pi-images.yml --ref "$TAG" -f tag="$TAG"
