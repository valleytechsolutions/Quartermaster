name: Release

# Publishing a GitHub release tagged v<version>, pushing that tag, or running this workflow by hand
# tests the app, builds the package and attaches it to the release as quartermaster.deb.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.1. It is created from this branch if it does not exist.'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  release:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install pillow numpy pyserial pytest
      - name: The tag matches the app version
        run: |
          version=$(python -c "import json; print(json.load(open('app-builder.json'))['version'])")
          test "$TAG" = "v$version" || { echo "Tag $TAG does not match app version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check the Cardputer release package
        run: |
          mkdir -p tests/vendor
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/CardputerZero/packages/5d55615e69cda109bdf20ea4a8e69c528bc19374/.github/scripts/install_path_policy.py' -o tests/vendor/install_path_policy.py
          python -c 'from tests.vendor.install_path_policy import rejected_paths'
          package=$(python tools/build_deb.py --out build/cardputer)
          QUARTERMASTER_STORE_DEB="$package" python -m pytest -q tests
      - name: Prepare the release assets
        run: |
          cd build/cardputer
          cp "quartermaster_${VERSION}_all.deb" quartermaster.deb
          sha256sum quartermaster.deb "quartermaster_${VERSION}_all.deb" > SHA256SUMS
      - name: Release notes for this version
        run: |
          awk -v version="$VERSION" '$1 == "##" { on = ($2 == version) ; next } on' CHANGELOG.md > build/changes.md
          test -s build/changes.md
          {
            echo "**This is the CardputerZero version of Quartermaster.**" \
              "Building one on a Raspberry Pi with a Waveshare LCD HAT?" \
              "Use the DIY version: the names of its releases end in \"for Raspberry Pi\", and the" \
              "[DIY guide](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/diy.md) shows how to flash it."
            echo
            sed '/[^[:space:]]/,$!d' build/changes.md
          } > build/notes.md
      - name: Publish the Cardputer package
        run: |
          files=(build/cardputer/quartermaster.deb "build/cardputer/quartermaster_${VERSION}_all.deb" build/cardputer/SHA256SUMS)
          if ! names=$(gh release view "$TAG" --json assets --jq '.assets[].name'); then
            gh release create "$TAG" --target "$(git rev-parse HEAD)" \
              --title "Quartermaster $VERSION for CardputerZero" --notes-file build/notes.md "${files[@]}"
            exit 0
          fi
          found=0
          for file in "${files[@]}"; do
            if grep -Fxq "${file##*/}" <<< "$names"; then found=$((found + 1)); fi
          done
          if (( found == ${#files[@]} )); then
            echo "$TAG already has its Cardputer packages and checksums."
          elif (( found )); then
            echo "::error::$TAG already contains part of the Cardputer release. Check its published checksums."
            exit 1
          else
            git fetch --no-tags origin "refs/tags/$TAG"
            test "$(git rev-parse HEAD)" = "$(git rev-parse 'FETCH_HEAD^{commit}')"
            gh release upload "$TAG" "${files[@]}"
          fi
      - name: Give a release published by hand its title and banner
        run: |
          title="Quartermaster $VERSION for CardputerZero"
          latest=$(gh release view --json tagName --jq .tagName) || true
          gh release view "$TAG" --json body --jq .body > build/old.md
          rest=$(awk 'index($0, "**This is the CardputerZero version of Quartermaster.**") != 1' build/old.md |
            sed '/[^[:space:]]/,$!d')
          [ -n "$rest" ] || rest=$(sed '/[^[:space:]]/,$!d' build/changes.md)
          { head -n 1 build/notes.md; printf '\n%s\n' "$rest"; } > build/titled.md
          if [ "$(cat build/titled.md)" = "$(cat build/old.md)" ] &&
            [ "$(gh release view "$TAG" --json name --jq .name)" = "$title" ]; then
            echo "$TAG has its title and banner."
            exit 0
          fi
          gh release edit "$TAG" --title "$title" --notes-file build/titled.md
          now=$(gh release view --json tagName --jq .tagName) || true
          if [ -n "$latest" ] && [ "$now" != "$latest" ]; then
            gh release edit "$latest" --latest
            echo "::error::$TAG took the Latest badge from $latest. It was given back to $latest."
            exit 1
          fi
          echo "$TAG now has its title and banner."
