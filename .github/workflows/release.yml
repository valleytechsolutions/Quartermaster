name: Release

# Publishing a GitHub release tagged v<version>, pushing that tag, or running this workflow by hand
# tests the app, builds the package and attaches it to the release as quartermaster.deb.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0. It is created from this branch if it does not exist.'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install pillow numpy pyserial pytest
      - name: The tag matches the app version
        run: |
          version=$(python -c "import json; print(json.load(open('app-builder.json'))['version'])")
          test "$TAG" = "v$version" || { echo "Tag $TAG does not match app version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Tests
        run: python -m pytest -q tests
      - name: Build the package
        run: |
          python tools/build_deb.py --out build
          cp "build/quartermaster_${VERSION}_all.deb" build/quartermaster.deb
          (cd build && sha256sum *.deb > SHA256SUMS)
      - name: Release notes for this version
        run: |
          awk -v version="$VERSION" '$1 == "##" { on = ($2 == version) ; next } on' CHANGELOG.md > build/notes.md
          test -s build/notes.md
      - name: Create or update the GitHub release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "Quartermaster $VERSION" \
              --notes-file build/notes.md
          fi
          gh release upload "$TAG" build/*.deb build/SHA256SUMS --clobber
