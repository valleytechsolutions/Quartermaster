name: Release

# Publishing a GitHub release tagged v<version>, pushing that tag, or running this workflow by hand
# tests the app, builds a universal Python wheel, and attaches it to the release.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.1. It is created from this branch if it does not exist.'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install '.[test,performance,pi-hat]' build
      - name: The tag matches the app version
        run: |
          version=$(python -c "from quartermaster import __version__; print(__version__)")
          test "$TAG" = "v$version" || { echo "Tag $TAG does not match app version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Tests
        run: python -m pytest -q tests
      - name: Build the wheel
        run: |
          python -m build --wheel --outdir build/dist
          (cd build/dist && sha256sum *.whl > SHA256SUMS)
      - name: Release notes for this version
        run: |
          awk -v version="$VERSION" '$1 == "##" { on = ($2 == version) ; next } on' CHANGELOG.md > build/notes.md
          test -s build/notes.md
      - name: Create or update the GitHub release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "Quartermaster $VERSION" \
              --notes-file build/notes.md
          fi
          gh release upload "$TAG" build/dist/*.whl build/dist/SHA256SUMS --clobber
